name: build-ticket-index

# 每当订单档发生变化，就重建索引与脱敏公开档。
on:
  push:
    branches: [main]
    paths:
      - 'tickets/orders/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ticket-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建索引
        run: python3 scripts/build_ticket_index.py --dir tickets

      - name: 提交变更
        run: |
          git config user.name "ticket-bot"
          git config user.email "ticket-bot@users.noreply.github.com"
          git add tickets/index.json tickets/public
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
          else
            git commit -m "chore(index): rebuild ticket index [skip ci]"
            git push
          fi
