  AD:{key:'AD',n:'成人',short:'成人',rate:1.00,age:'≥ 12 岁'},
  CH:{key:'CH',n:'儿童',short:'儿童',rate:0.75,age:'2–11 岁'},

/* ============ 工具 ============ */
function $(i){return document.getElementById(i)}
function fp(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sD(s){if(!s)return'';var p=s.split('-');return +p[1]+'月'+ +p[2]+'日'}
var WK=['周日','周一','周二','周三','周四','周五','周六'];
function pD(s){if(!s)return'';var p=s.split('-'),x=new Date(+p[0],+p[1]-1,+p[2]);return(x.getMonth()+1)+'月'+x.getDate()+'日 '+WK[x.getDay()]}
function pT(t){return t.slice(0,2)+':'+t.slice(2)}

function isInternationalOrder(segs){
  for(var i=0;i<segs.length;i++){
    var s=segs[i];
    if(s.fromCode && DOM.indexOf(s.fromCode)===-1)return true;
    if(s.toCode && DOM.indexOf(s.toCode)===-1)return true;
    if(s.hubCode && DOM.indexOf(s.hubCode)===-1)return true;
  }
  return false;
}

/* ============ 价格计算 ============ */
function fmtRate(r){if(r>=0.999)return'全价';var n=Math.round(r*1000)/10;return n.toFixed(1).replace(/\.0$/,'')+' 折'}
function segRawDisc(seg){return seg.baseRawDisc!=null?seg.baseRawDisc:seg.baseDisc}
function subRate(seg,tier){
  var raw=segRawDisc(seg),full=seg.baseFull;
  var baseRate=full>0?raw/full:1;
  if(tier==='b')return baseRate;
  if(tier==='s')return (baseRate+1)/2;
  if(tier==='f')return 1;
  return baseRate;
}
function subPrice(seg,tier){return Math.round(seg.baseFull*subRate(seg,tier))}
function segPricePerAdult(seg){
  var p=subPrice(seg,seg.subTier||'b');
  var r=seg.actRate!=null?seg.actRate:1;
  return Math.round(p*r);
}
function segPriceTotal(seg){
  var unit=segPricePerAdult(seg);
  var sum=0;
  paxList.forEach(function(p){sum+=unit*PAX_TYPE[p.type].rate});
  return Math.round(sum);
}
function segPriceDetail(seg){
  var unit=segPricePerAdult(seg);
  var rows=[];
  ['AD','CH','IN'].forEach(function(t){
    var n=paxList.filter(function(p){return p.type===t}).length;
    if(n>0)rows.push({type:t,n:n,unit:unit*PAX_TYPE[t].rate,sub:unit*PAX_TYPE[t].rate*n});
  });
  return {unit:unit,rows:rows,total:rows.reduce(function(a,r){return a+r.sub},0)};
}
function cabName(c){return {Y:'经济舱',W:'众选经济舱',C:'商务舱',F:'头等舱',A:'套房'}[c]||c}
function subCode(cabin,tier){var m=SUB_CODE[cabin];return m?(m[tier]||cabin):cabin}

function ageAt(dateStr){
  if(!dateStr)return 30;
  var p=dateStr.split('-'),b=new Date(+p[0],+p[1]-1,+p[2]),now=new Date();
  var a=now.getFullYear()-b.getFullYear();
  var m=now.getMonth()-b.getMonth();
  if(m<0||(m===0&&now.getDate()<b.getDate()))a--;
  return a;
}
function paxTypeFromBirth(birth){
  var a=ageAt(birth);
  if(a<2)return 'IN';
  if(a<12)return 'CH';
  return 'AD';
}

function newPax(isIntl){

}

/* ============ 明细 ============ */
function detRow(label,val,cls){return '<div class="row'+(cls?' '+cls:'')+'"><span>'+label+'</span><b>'+(cls==='minus'?'−':'+')+'MZB '+fp(val)+'</b></div>'}
function detRowPlain(label,val){return '<div class="row"><span>'+label+'</span><b>MZB '+fp(val)+'</b></div>'}

function segDetail(seg){
  var tier=seg.subTier||'b';
  var cab=seg.flights[0].cabin;
  var code=subCode(cab,tier);
  var rate=subRate(seg,tier);
  var subP=subPrice(seg,tier);
  var actR=seg.actRate!=null?seg.actRate:1;
  var unitAdult=Math.round(subP*actR);
  var det=segPriceDetail(seg);

  var h='<div class="dt">';
  h+=detRowPlain('基础价（含税全价 / 成人）',seg.baseFull);
  var subDisc=seg.baseFull-subP;
  if(subDisc>0)h+=detRow(code+' 舱 · '+fmtRate(rate),subDisc,'minus');
  if(seg.activity)h+=detRow(seg.activity.code+' · '+seg.activity.label+' '+(seg.activity.rate*10).toFixed(1)+' 折',subP-unitAdult,'minus');
  if(det.rows.length>1||det.rows[0].type!=='AD'){
    h+='<div class="row pax-info"><span>乘客构成</span><span>'
      + det.rows.map(function(r){return PAX_TYPE[r.type].short+' × '+r.n}).join(' · ')
      + '</span></div>';
    det.rows.forEach(function(r){
      if(r.type==='AD')h+=detRowPlain('成人 × '+r.n,r.sub);
      else h+=detRow(PAX_TYPE[r.type].n+' × '+r.n+'（'+PAX_TYPE[r.type].rate*10+' 折）',r.sub,'plus');
    });
  }
  h+='<div class="row sub"><span>段小计</span><b>MZB '+fp(det.total)+'</b></div>';
  h+='</div>';
  return h;
}

function sumH(segs,rtRate){
  var h='',tot=0;
  segs.forEach(function(s){
    var tier=s.subTier||'b';
    var cab=s.flights[0].cabin;
    var code=subCode(cab,tier);
    var p=segPriceTotal(s);
    tot+=p;
    var dt2='';
    if(s.type==='d'){
      var f=s.flights[0];
      dt2='<b>'+f.no+'</b> · 舱位 '+f.cabin+' · 子仓位 '+code;
    }else{
      var f1=s.flights[0],f2=s.flights[1];
      dt2='<b>'+f1.no+' + '+f2.no+'</b> · 舱位 '+f1.cabin+' / '+f2.cabin+' · 子仓位 '+code;
    }
    h+='<div class="ssg"><div class="ssgh"><span class="ssgd">'+s.dir+'</span><span class="ssgr">'+s.fromCity+' → '+s.toCity+'</span></div><div class="ssgd2">'+dt2+'</div>'+segDetail(s)+'<div class="ssgp"><em>MZB</em><b>'+fp(p)+'</b></div></div>';
  });
  var isRound=rtRate<1;
  var finalTot=tot,roundSave=0;
  if(isRound){finalTot=Math.round(tot*rtRate);roundSave=tot-finalTot}
  var tb='<div class="tb">';
  tb+='<div class="tr"><span>各航段折后小计</span><b>MZB '+fp(tot)+'</b></div>';
  if(isRound)tb+='<div class="tr minus"><span>往返折扣 '+Math.round(rtRate*100)+'%</span><b>−MZB '+fp(roundSave)+'</b></div>';
  tb+='<div class="tr final"><span>应付总额</span><span class="amt"><em>MZB</em><b>'+fp(finalTot)+'</b><small>起</small></span></div>';
  tb+='</div>';
  return '<div class="smry"><h3>价格明细</h3>'+h+tb+'<button class="bp" id="payBtn">确认并支付</button><a class="bb" href="ticket.html">返回修改航班</a><p class="note">以上价格含税。最终金额以支付页面为准。</p></div>';
}

var TICKET_PREFIX='919-';
var TICKET_BASE=3285320000;
var TICKET_KEY='peace_ticket_counter';

function nextTicketNo(){
  var seq=parseInt(localStorage.getItem(TICKET_KEY)||'0',10);
  if(isNaN(seq)||seq<0)seq=0;
  localStorage.setItem(TICKET_KEY,String(seq+1));
  var num=TICKET_BASE+seq;
  return TICKET_PREFIX+String(num).padStart(10,'0');
}
function genOrderNo(){
  var d=new Date();
  var p=function(n,l){return String(n).padStart(l||2,'0')};
  return 'PE'
    + d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())
    + p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())
    + p(Math.floor(Math.random()*1000),3);
}
function fmtDateTime(iso){
  if(!iso)return'';
  var d=new Date(iso);
  var p=function(n){return String(n).padStart(2,'0')};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())
       +' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

/* ============ 构建 txt 全文 ============ */
function buildTicketTxt(payload){
  var L=[];
  var line='================================================';
  var thin='------------------------------------------------';
  var t2=function(t){return String(t).slice(0,2)+':'+String(t).slice(2)};

  L.push(line);
  L.push('  众和航空 Peace Airlines — 电子客票行程单');
  L.push(line);
  L.push('');
  L.push('订单号    : ' + payload.orderNo);
  L.push('出票时间  : ' + fmtDateTime(payload.issuedAt));
  L.push('订单状态  : 已出票 (PAID)');
  L.push('支付方式  : 免密支付 (Silent Pay)');
  L.push('');
  L.push(thin); L.push('  乘机人信息'); L.push(thin);
  payload.passengers.forEach(function(p,i){
    L.push('  ['+(i+1)+'] '+p.nameCn+' / '+p.nameEn);
    L.push('      客票号  : '+(p.ticketNo||''));
    L.push('      乘客类型: '+p.typeName+'（票价系数 '+p.rate.toFixed(2)+'）');
    L.push('      证件    : '+p.idType+' '+p.idNo);

    if(p.issuer)L.push('      签发国  : '+p.issuer);
    L.push('      出生日期: '+p.birth);
    L.push('');
  });
  L.push(thin); L.push('  行程信息'); L.push(thin);
  payload.segments.forEach(function(s){
    L.push('');
    L.push('  ── '+s.dir+' ─ '+s.fromCity+' → '+s.toCity);
    L.push('     子仓位: '+s.subName+'（'+s.subCode+'）');
    s.flights.forEach(function(f){
      L.push('     '+f.no+'  '+(f.airlineName||'')+'  '+(f.ac||''));
      L.push('       '+f.depDate+' '+t2(f.dep)+'  '+(f.fromCity||'')+(f.fromAirport||'')+' ('+(f.fromCode||'')+')');
      L.push('       '+f.arrDate+' '+t2(f.arr)+'  '+(f.toCity||'')+(f.toAirport||'')+' ('+(f.toCode||')'.slice(1)+')')+(f.arrNextDay?'  [次日到达]':''));
      L.push('       舱位: '+f.cabin+' · '+f.cabinName);
      L.push('');
    });
  });
  L.push(thin); L.push('  价格明细'); L.push(thin);
  L.push('  各航段折后小计     : MZB '+fp(payload.subtotal));
  if(payload.roundTripRate<1 && payload.roundTripSave>0){
    L.push('  往返折扣 '+Math.round(payload.roundTripRate*100)+'%       : -MZB '+fp(payload.roundTripSave));
  }
  L.push('  应付总额           : MZB '+fp(payload.total));
  L.push('');
  L.push(line);
  L.push('  本客票由众和航空出具，请妥善保管，乘机时请携带有效证件。');
  L.push('  客服热线 95058 · 官网 peaceairlines.com');
  L.push(line);
  return L.join('\r\n');
}

/* ============================================================
   GitHub 上传（Contents API）
   ============================================================ */
function isGhConfigured(){
  return GH.owner && GH.owner.indexOf('YOUR_')!==0
      && GH.repo  && GH.repo.indexOf('YOUR_')!==0
      && GH.token && GH.token.indexOf('github_pat_')===0
      && GH.token.length>30;
}
function utf8ToBase64(str){
  var bytes=new TextEncoder().encode(str);
  var bin='';
  for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function ghUpload(filename,content){
  var url='https://api.github.com/repos/'+GH.owner+'/'+GH.repo
        + '/contents/'+GH.dir+'/'+encodeURIComponent(filename);
  var body={
    message:'ticket: '+filename,
    content:utf8ToBase64(content),
    branch:GH.branch
  };
  return fetch(url,{
    method:'PUT',
    headers:{
      'Authorization':'Bearer '+GH.token,
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json',
      'X-GitHub-Api-Version':'2022-11-28'
    },
    body:JSON.stringify(body)
  }).then(function(r){
    return r.text().then(function(txt){
      var json;try{json=JSON.parse(txt)}catch(e){json={}}
      if(!r.ok){
        var msg=json.message||('HTTP '+r.status);
        var err=new Error(msg);
        err.status=r.status;
        throw err;
      }
      return json;
    });
  });
}

/* ============ 主渲染 ============ */
function render(){
  var bk=readBooking();
  if(!bk||!bk.segments||!bk.segments.length){
    $('root').innerHTML='<div class="emp"><h3>还没有选择航班</h3><p>请先返回选择航班页面，完成去程与回程的选择后再进入结算。</p><a class="bg2" href="ticket.html">前往选择航班</a></div>';
    return;
  }
  segsData=bk.segments;
  roundTripRate=bk.roundTripRate||1;
  isIntlOrder=isInternationalOrder(segsData);
  if(!paxList.length)paxList=[newPax(isIntlOrder)];

  var mh='';
  segsData.forEach(function(s){mh+=segCard(s)});
  mh+='<div class="sc" id="paxCard"></div>';

  $('root').innerHTML='<div class="cl2"><div class="cm">'+mh+'</div><aside class="cs" id="cSide"></aside></div>';

  renderPaxCard();
  renderSide();
  bindSub();
  bindPax();
}

function renderPaxCard(){
  var el=$('paxCard');
  if(el)el.innerHTML=renderPax();
}
function renderSide(){
  var el=$('cSide');
  if(el){el.innerHTML=sumH(segsData,roundTripRate);bindPay()}
}

function bindSub(){
  Array.prototype.forEach.call(document.querySelectorAll('.so input'),function(inp){
    inp.addEventListener('change',function(){
      var k=inp.getAttribute('data-seg'),v=inp.value;
      for(var i=0;i<segsData.length;i++)if(segsData[i].key===k){segsData[i].subTier=v;break}
      var mh='';
      segsData.forEach(function(s){mh+=segCard(s)});
      mh+='<div class="sc" id="paxCard"></div>';
      document.querySelector('.cm').innerHTML=mh;
      renderPaxCard();bindSub();bindPax();renderSide();
    });
  });
}

function bindPax(){
  var add=$('pxAdd');
  if(add)add.addEventListener('click',function(){
    paxList.push(newPax(isIntlOrder));
    renderPaxCard();bindPax();renderSide();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.px-del'),function(btn){
    btn.addEventListener('click',function(){
      if(btn.hasAttribute('disabled'))return;
      var id=btn.getAttribute('data-del');
      paxList=paxList.filter(function(p){return p.id!==id});
      renderPaxCard();bindPax();renderSide();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.px-row'),function(row){
    var id=row.getAttribute('data-id');
    var p=paxList.filter(function(x){return x.id===id})[0];
    if(!p)return;

    var iCn=row.querySelector('input[data-f="nameCn"]');
    if(iCn)iCn.addEventListener('input',function(){p.nameCn=this.value});

    var iEn=row.querySelector('input[data-f="nameEn"]');
    if(iEn)iEn.addEventListener('input',function(){this.value=this.value.toUpperCase();p.nameEn=this.value});

    var iNo=row.querySelector('input[data-f="idNo"]');
    if(iNo)iNo.addEventListener('input',function(){p.idNo=this.value});

    var iNat=row.querySelector('input[data-f="nationality"]');
    if(iNat)iNat.addEventListener('input',function(){this.value=this.value.toUpperCase();p.nationality=this.value});

    var iIss=row.querySelector('input[data-f="issuer"]');
    if(iIss)iIss.addEventListener('input',function(){this.value=this.value.toUpperCase();p.issuer=this.value});

    var iBirth=row.querySelector('input[data-f="birth"]');
    if(iBirth)iBirth.addEventListener('change',function(){
      p.birth=this.value;
      var t=paxTypeFromBirth(this.value);
      if(t!==p.type){
        p.type=t;
        renderPaxCard();bindPax();renderSide();
      }
    });

    var sType=row.querySelector('select[data-f="idType"]');
    if(sType)sType.addEventListener('change',function(){
      p.idType=this.value;
      var show=needCountry(this.value);
      Array.prototype.forEach.call(row.querySelectorAll('.px-country'),function(el){
        el.classList.toggle('hide',!show);
      });
      if(!show){p.nationality='';p.issuer='';}
    });
  });
}

/* ============ 校验 ============ */
function validatePax(){
  for(var i=0;i<paxList.length;i++){
    var p=paxList[i],idx=i+1;
    if(!p.nameCn.trim()){alert('请填写第 '+idx+' 位乘机人的中文姓名');return false}
    if(!p.nameEn.trim()){alert('请填写第 '+idx+' 位乘机人的英文姓名');return false}
    if(!/^[A-Za-z\s\-\.\/]+$/.test(p.nameEn.trim())){alert('第 '+idx+' 位乘机人的英文姓名格式有误，请使用字母、空格、连字符或斜杠');return false}
    if(!p.idNo.trim()){alert('请填写第 '+idx+' 位乘机人的证件号码');return false}
    if(!p.birth){alert('请填写第 '+idx+' 位乘机人的出生日期');return false}
    if(isIntlOrder && p.idType==='身份证'){alert('第 '+idx+' 位乘机人：国际航班不可使用身份证购买');return false}
    if(needCountry(p.idType)){
      if(!/^[A-Za-z]{3}$/.test(p.nationality)){alert('请填写第 '+idx+' 位乘机人的国籍三字码（3 位字母，如 CHN）');return false}
      if(!/^[A-Za-z]{3}$/.test(p.issuer)){alert('请填写第 '+idx+' 位乘机人的签发国三字码（3 位字母，如 CHN）');return false}
    }
  }
  return true;
}

/* ============ ★ 支付 + 上传 GitHub ============ */
function bindPay(){
  var btn=$('payBtn');if(!btn)return;
  btn.addEventListener('click',function(){
    if(btn.disabled)return;
    if(!validatePax())return;
    btn.disabled=true;
    var oldText=btn.textContent;
    btn.textContent='正在出票…';

    try{
      /* 1) 组装 payload */
      var subtotal=segsData.reduce(function(a,s){return a+segPriceTotal(s)},0);
      var isRound=roundTripRate<1;
      var finalTot=isRound?Math.round(subtotal*roundTripRate):subtotal;

      var payload={
        isIntlOrder:isIntlOrder,
        passengers:paxList.map(function(p){
          return {
            id:p.id,nameCn:p.nameCn,nameEn:p.nameEn,
            idType:p.idType,idNo:p.idNo,birth:p.birth,
            nationality:needCountry(p.idType)?p.nationality.toUpperCase():'',
            issuer:needCountry(p.idType)?p.issuer.toUpperCase():'',
            type:p.type,typeName:PAX_TYPE[p.type].n,rate:PAX_TYPE[p.type].rate
          };
        }),
        segments:segsData.map(function(s){
          var tier=s.subTier||'b';
          var cab=s.flights[0].cabin;
          var det=segPriceDetail(s);
          return {
            key:s.key,dir:s.dir,date:s.date,
            subTier:tier,
            subName:SUB[tier].n,subCode:subCode(cab,tier),
            fromCity:s.fromCity,toCity:s.toCity,
            fromAirport:s.fromAirport,toAirport:s.toAirport,
            baseFull:s.baseFull,
            subRate:subRate(s,tier),
            subPrice:subPrice(s,tier),
            actRate:s.actRate||1,
            actCode:s.activity?s.activity.code:null,
            unitAdult:segPricePerAdult(s),
            priceByType:det.rows,
            finalPrice:det.total,
            flights:s.flights
          };
        }),
        subtotal:subtotal,
        roundTripRate:roundTripRate,
        roundTripSave:isRound?(subtotal-finalTot):0,
        total:finalTot
      };

      /* 2) 订单号 & 客票号 */
      payload.orderNo=genOrderNo();
      payload.issuedAt=new Date().toISOString();
      payload.passengers.forEach(function(p){p.ticketNo=nextTicketNo()});

      /* 3) txt */
      var txt=buildTicketTxt(payload);
      var filename=payload.orderNo+'.txt';

      /* 4) 先本地存一份，保证网络失败也有备份 */
      try{
        sessionStorage.setItem('peace_booking_final',JSON.stringify(payload));
        localStorage.setItem('peace_ticket_latest_txt',txt);
        localStorage.setItem('peace_ticket_latest_json',JSON.stringify(payload));
        localStorage.setItem('peace_ticket_latest_name',filename);
      }catch(e){}

      /* 5) 上传 GitHub（异步，失败也不阻断跳转） */
      if(isGhConfigured()){
        btn.textContent='正在上传客票…';
        ghUpload(filename,txt).then(function(res){
          payload.storage={
            provider:'github',ok:true,filename:filename,
            path:GH.dir+'/'+filename,
            repoUrl:'https://github.com/'+GH.owner+'/'+GH.repo+'/blob/'+GH.branch+'/'+GH.dir+'/'+filename,
            rawUrl:'https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/'+GH.branch+'/'+GH.dir+'/'+filename
          };
          try{
            sessionStorage.setItem('peace_booking_final',JSON.stringify(payload));
            localStorage.setItem('peace_ticket_latest_json',JSON.stringify(payload));
          }catch(e){}
          location.href='payment.html';
        }).catch(function(err){
          payload.storage={
            provider:'github',ok:false,filename:filename,
            error:(err&&err.message)||'上传失败'
          };
          try{
            sessionStorage.setItem('peace_booking_final',JSON.stringify(payload));
            localStorage.setItem('peace_ticket_latest_json',JSON.stringify(payload));
          }catch(e){}
          location.href='payment.html';
        });
        return;
      }

      /* 未配置 GitHub：本地保存 + 直接跳转 */
      payload.storage={provider:'local',ok:false,filename:filename,error:'未配置 GitHub 上传'};
      try{
        sessionStorage.setItem('peace_booking_final',JSON.stringify(payload));
        localStorage.setItem('peace_ticket_latest_json',JSON.stringify(payload));
      }catch(e){}
      location.href='payment.html';

    }catch(e){
      console.error(e);
      btn.disabled=false;
      btn.textContent=oldText;
      alert('出票失败：'+(e.message||'未知错误'));
    }
  });
}

render();
})();
</script>
