function dur(f){var fo=AP[f.from]?AP[f.from].ut:0,to=AP[f.to]?AP[f.to].ut:0,dh=+f.dep.slice(0,2),dm=+f.dep.slice(2),ah=+f.arr.slice(0,2),am=+f.arr.slice(2),du=dh*60+dm-fo*60,au=ah*60+am-to*60;if(f.nd)au+=1440;var df=au-du;while(df<0)df+=1440;return df}

/* 到达时刻的 UTC 分钟（相对当天 00:00 UTC，跨天则 +1440） */
function arrU(f){var to=AP[f.to]?AP[f.to].ut:0,h=+f.arr.slice(0,2),m=+f.arr.slice(2),t=h*60+m-to*60;if(f.nd)t+=1440;return t}
/* 出发时刻的 UTC 分钟（相对当天 00:00 UTC） */
function depU(f){var fo=AP[f.from]?AP[f.from].ut:0,h=+f.dep.slice(0,2),m=+f.dep.slice(2);return h*60+m-fo*60}
/* 中转时长（分钟）：第二程起飞 UTC 时刻 - 第一程到达 UTC 时刻 */
function loMin(a,b){var ar=arrU(a),dp=depU(b);while(dp<ar)dp+=1440;return dp-ar}

/* ★★★ 修复：dayOff 用"当地日期差"而非 UTC 天数差 ★★★ */
function dayOff(a,b){
  var total = dur(a) + loMin(a,b);
  var fUtA = AP[a.from] ? AP[a.from].ut : 0;
  var fUtB = AP[b.from] ? AP[b.from].ut : 0;
  /* 第一程出发/第二程起飞，相对第一程出发当天 00:00 UTC 的当地分钟数 */
  var depLocalA = depU(a) + fUtA*60;
  var depLocalB = depU(a) + total + fUtB*60;
  /* 相对当地午夜的天数 */
  var dayA = Math.floor(depLocalA / 1440);
  var dayB = Math.floor(depLocalB / 1440);
  return dayB - dayA;
}

function getAct(l1,l2){

  if((aD&&bL)||(aL&&bD))return ACT.DJDF01;
  if((aD&&bS)||(aS&&bD))return ACT.DJDF02;
  if(aD&&bD)return ACT.DJDF03;
  if(aS&&bL)return ACT.DJFE01;
  if(aL&&bS)return ACT.DJEF01;
  return null;
}
function tMin(g){

  for(var i=0;i<g.leg2s.length&&!act;i++)act=getAct(g.leg1,g.leg2s[i]);
  if(act)t=Math.round(t*act.rate);
  return{t:t,a:a,b:b,act:act};
}

'<div class="fm"><span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l4 4.5-2.1 2.1-2.2-.4a.5.5 0 0 0-.5.8l2.3 2.3 2.3 2.3a.5.5 0 0 0 .8-.5l-.4-2.2 2.1-2.1 4.5 4a.5.5 0 0 0 .8-.5Z"/></svg>'+l1.ac+'</span>'+(mlT(l1.ml)?'<span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 4 0V3"/><path d="M9 11v10"/><path d="M17 3c-1.5 2-1.5 5 0 7v11"/></svg>'+mlT(l1.ml)+'</span>':'')+'</div>'+
'<div class="ff">'+fRows(l1,'data-role="l1"')+'</div></div>'+
'<div class="ts leg2 lock"><div class="tsh"><span class="bg">2</span><span>第二程 · '+hc+' → 目的地</span></div><div class="l2h">请先选择第一程的舱位，再选择第二程航班与舱位。</div><div class="l2b"><div class="lb2"><span class="ic">中转</span><span>在 <b>'+hc+'</b> 中转，请选择后续航班</span></div>'+l2b+'</div></div></article>';
}

function rSub(items,label,alt,sk,dd){if(!items.length)return'';
var bk={1:[],2:[],3:[],4:[]};items.forEach(function(x){bk[x.pri].push(x)});
var md=state.sort;
[1,2,3,4].forEach(function(p){bk[p].sort(function(a,b){if(md==='dur'){if(a.dur!==b.dur)return a.dur-b.dur;return(a.price||0)-(b.price||0)}if(a.price!==b.price)return(a.price||0)-(b.price||0);return a.dur-b.dur})});
var h='';
if(label)h+='<div class="ast'+(alt?' alt':'')+'">'+label+'<span class="bdg">共 '+items.length+' 个</span></div>';
[1,2,3,4].forEach(function(p){if(!bk[p].length)return;h+='<div class="sub">'+BT[p]+'<span class="n">共 '+bk[p].length+' 个</span></div>';
bk[p].forEach(function(it,i){h+=it.type==='d'?fCard(it.data,sk,dd):tCard(it.data,sk,p+'-'+i,dd)})});return h}
function segH(dir,title,dt,dF,tG,sk,fc,tc){var items=buildItems(dF,tG,fc,tc);
if(!items.length)return '<div class="seg" id="seg-'+sk+'"><div class="sgh"><span class="dir">'+dir+'</span><h3>'+title+'</h3>'+(dt?'<span class="dt">'+pD(dt)+'</span>':'')+'</div><div class="es"><h4>该航段暂无航班</h4><p>暂无可售航班，请调整出发地、目的地或日期后重新搜索。</p></div></div>';
var ex=items.filter(function(x){return x.exact}),ot=items.filter(function(x){return !x.exact});
var h='<div class="seg" id="seg-'+sk+'"><div class="sgh"><span class="dir">'+dir+'</span><h3>'+title+'</h3>'+(dt?'<span class="dt">'+pD(dt)+'</span>':'')+'</div>';
var isPas=fc==='PAS'||tc==='PAS';
if(isPas)h+=rSub(ex,null,false,sk,dt);
else if(ex.length&&ot.length){h+=rSub(ex,cAp(fc)+' → '+cAp(tc),false,sk,dt);h+=rSub(ot,'同城其他机场',true,sk,dt)}
else if(ot.length)h+=rSub(ot,'同城其他机场',true,sk,dt);
else h+=rSub(ex,null,false,sk,dt);
return h+'</div>'}

function clearSegment(sk){
  Array.prototype.forEach.call(document.querySelectorAll('.fc[data-seg="'+sk+'"]'),function(c){
    Array.prototype.forEach.call(c.querySelectorAll('.frow.sel'),function(r){r.classList.remove('sel');var b=r.querySelector('.fsel');if(b)b.textContent='选择'});
    c.classList.remove('sel');
    var l1s=c.querySelector('.ts.l1');if(l1s)l1s.classList.remove('l1ok');
    var l2s=c.querySelector('.ts.leg2');if(l2s){l2s.classList.add('lock');l2s.classList.remove('l2ok')}
    Array.prototype.forEach.call(c.querySelectorAll('.l2f'),function(el){el.classList.remove('picked')});
  });
}

function render(){
  var box=$('results');
  if(!state.from||!state.to){
    $('rr').textContent='';$('rc').textContent='';
    box.innerHTML='<div class="es"><h4>请选择出发地与目的地</h4><p>在上方输入出发城市与到达城市，然后点击「搜索航班」查看可选航班。</p></div>';
    $('ckb').classList.remove('on');document.body.classList.remove('ck');$('snav').classList.remove('on');
    return;
  }
  if(state.from===state.to){$('rr').textContent='';$('rc').textContent='';box.innerHTML='<div class="es"><h4>出发地与目的地相同</h4><p>请选择不同的出发地与目的地。</p></div>';return}
  var oD,oG,iD,iG,tot;
  try{
    oD=dirSearch(state.from,state.to);oG=tGroups(state.from,state.to);iD=[];iG=[];
    if(state.type==='round'){iD=dirSearch(state.to,state.from);iG=tGroups(state.to,state.from)}
    tot=oD.length+oG.length+iD.length+iG.length;
  }catch(err){console.error('[search error]',err);$('rr').textContent='';$('rc').textContent='';box.innerHTML='<div class="es"><h4>搜索出错</h4><p>'+esc(err.message)+'</p></div>';return}
  var html='';
  try{
    html=segH('去程',city(state.from)+' → '+city(state.to),state.dep,oD,oG,'out',state.from,state.to);
    if(state.type==='round')html+=segH('回程',city(state.to)+' → '+city(state.from),state.ret,iD,iG,'in',state.to,state.from);
  }catch(err){console.error('[render error]',err);$('rr').textContent='';$('rc').textContent='';box.innerHTML='<div class="es"><h4>渲染出错</h4><p>'+esc(err.message)+'</p></div>';return}
  box.innerHTML=html;
  $('rr').textContent=city(state.from)+' → '+city(state.to);
  $('rc').textContent=tot?('共 '+tot+' 个航班'):'暂无航班';
  try{bindFare();restoreSel();upNav()}catch(err){console.error('[post-render]',err)}
}

function restoreSel(){['out','in'].forEach(function(sk){var s=sel[sk];if(!s)return;
if(s.type==='d'){var rs=document.querySelectorAll('.fc[data-seg="'+sk+'"]:not(.is-t) .frow');Array.prototype.forEach.call(rs,function(r){if(r.getAttribute('data-no')===s.fNo&&r.getAttribute('data-cabin')===s.cab){r.classList.add('sel');var b=r.querySelector('.fsel');if(b)b.textContent='已选';var c=r.closest('.fc');if(c)c.classList.add('sel')}})}
else if(s.type==='t'){var rs=document.querySelectorAll('.fc.is-t[data-seg="'+sk+'"] .frow[data-role="l1"]'),tg=null;
Array.prototype.forEach.call(rs,function(r){if(r.getAttribute('data-no')===s.l1No&&r.getAttribute('data-cabin')===s.l1Cab){r.classList.add('sel');var b=r.querySelector('.fsel');if(b)b.textContent='已选';tg=r.closest('.fc')}});
if(!tg)return;tg.classList.add('sel');tg.querySelector('.ts.l1').classList.add('l1ok');tg.querySelector('.ts.leg2').classList.remove('lock');
if(s.l2No&&s.l2Cab){var rs2=tg.querySelectorAll('.frow[data-role="l2"]');
Array.prototype.forEach.call(rs2,function(r){if(r.getAttribute('data-no')===s.l2No&&r.getAttribute('data-cabin')===s.l2Cab){r.classList.add('sel');var b=r.querySelector('.fsel');if(b)b.textContent='已选';tg.querySelector('.ts.leg2').classList.add('l2ok');var lf=r.closest('.l2f');if(lf)lf.classList.add('picked')}})}}})}

function upNav(){var n=$('snav');if(!n)return;var show=(state.type==='round'&&isSegDone(sel.out));n.classList.toggle('on',show);var ob=n.querySelector('[data-t="seg-out"]'),ib=n.querySelector('[data-t="seg-in"]');if(ob)ob.classList.toggle('done',isSegDone(sel.out));if(ib)ib.classList.toggle('done',isSegDone(sel.in));upNavAct()}
function upNavAct(){var n=$('snav');if(!n)return;var os=document.getElementById('seg-out'),is=document.getElementById('seg-in'),ob=n.querySelector('[data-t="seg-out"]'),ib=n.querySelector('[data-t="seg-in"]');if(ob)ob.classList.remove('act');if(ib)ib.classList.remove('act');if(!os){if(ib)ib.classList.add('act');return}if(!is){if(ob)ob.classList.add('act');return}var mid=scrollY+innerHeight*.35;if(is.offsetTop<=mid){if(ib)ib.classList.add('act')}else{if(ob)ob.classList.add('act')}}
function bindNav(){var n=$('snav');if(!n)return;Array.prototype.forEach.call(n.querySelectorAll('.snb'),function(b){b.addEventListener('click',function(){var t=document.getElementById(b.getAttribute('data-t'));if(!t)return;window.scrollTo({top:t.getBoundingClientRect().top+scrollY-96,behavior:'smooth'})})});addEventListener('scroll',upNavAct,{passive:true});addEventListener('resize',upNavAct,{passive:true})}

function bindFare(){Array.prototype.forEach.call(document.querySelectorAll('.frow'),function(row){row.addEventListener('click',function(e){e.stopPropagation();var card=row.closest('.fc');if(!card)return;var sk=card.getAttribute('data-seg'),role=row.getAttribute('data-role'),no=row.getAttribute('data-no'),cab=row.getAttribute('data-cabin');
if(role==='d'){clearSegment(sk);row.classList.add('sel');var b=row.querySelector('.fsel');if(b)b.textContent='已选';card.classList.add('sel');sel[sk]={type:'d',fNo:no,cab:cab};upCk();upNav();return}
if(role==='l1'){clearSegment(sk);row.classList.add('sel');var b1=row.querySelector('.fsel');if(b1)b1.textContent='已选';card.classList.add('sel');card.querySelector('.ts.l1').classList.add('l1ok');card.querySelector('.ts.leg2').classList.remove('lock','l2ok');sel[sk]={type:'t',l1No:no,l1Cab:cab,l2No:null,l2Cab:null};upCk();upNav();return}
if(role==='l2'){Array.prototype.forEach.call(card.querySelectorAll('.frow[data-role="l2"]'),function(r){r.classList.remove('sel');var bb=r.querySelector('.fsel');if(bb)bb.textContent='选择'});Array.prototype.forEach.call(card.querySelectorAll('.l2f'),function(el){el.classList.remove('picked')});row.classList.add('sel');var b2=row.querySelector('.fsel');if(b2)b2.textContent='已选';card.querySelector('.ts.leg2').classList.add('l2ok');var lf=row.closest('.l2f');if(lf)lf.classList.add('picked');if(sel[sk]&&sel[sk].type==='t'){sel[sk].l2No=no;sel[sk].l2Cab=cab}upCk();upNav();return}
})})}

function isSegDone(s){if(!s)return false;if(s.type==='d')return!!(s.fNo&&s.cab);if(s.type==='t')return!!(s.l1No&&s.l1Cab&&s.l2No&&s.l2Cab);return false}
function isAllDone(){if(!isSegDone(sel.out))return false;if(state.type==='round'&&!isSegDone(sel.in))return false;return true}
function cPrice(s){if(!s)return 0;if(s.type==='d'){var f=findF(s.fNo);return f?(dFare(f,s.cab)||0):0}if(s.type==='t'){var a=findF(s.l1No),b=findF(s.l2No);if(!a||!b)return 0;var t=(dFare(a,s.l1Cab)||0)+(dFare(b,s.l2Cab)||0);var act=getAct(a,b);if(act)t=Math.round(t*act.rate);return t}return 0}
function cBase(){return cPrice(sel.out)+cPrice(sel.in)}
function cTotal(){var t=cBase();if(state.type==='round')t=Math.round(t*RND);return t}
function segTxt(s){if(!s)return'';if(s.type==='d'){var f=findF(s.fNo);if(!f)return'';return'<b>'+f.no+'</b> '+cAp(f.from)+' → '+cAp(f.to)+' · '+cab(s.cab).n}if(s.type==='t'){var a=findF(s.l1No),b=findF(s.l2No);if(!a||!b)return'';return'<b>'+a.no+'</b> + <b>'+b.no+'</b> '+cAp(a.from)+' → '+cAp(b.to)+' · '+cab(s.l1Cab).n+' / '+cab(s.l2Cab).n}return''}
function upCk(){var b=$('ckb');if(!isAllDone()){b.classList.remove('on');document.body.classList.remove('ck');return}
var h='<div class="cln"><span class="clb">去程</span><span class="clt">'+segTxt(sel.out)+'</span></div>';
if(state.type==='round'&&sel.in)h+='<div class="cln"><span class="clb">回程</span><span class="clt">'+segTxt(sel.in)+'</span></div>';
$('cks').innerHTML=h;
var extra='';if(state.type==='round'){var base=cBase(),save=base-cTotal();extra='<span class="rnd">往返已省 MZB '+fp(save)+'</span>'}
$('cktWrap').innerHTML='<span class="lb">总计</span><em>MZB</em><b id="ckt">'+fp(cTotal())+'</b><small>起</small>'+extra;
b.classList.add('on');document.body.classList.add('ck')}
function resetSel(){sel.out=null;sel.in=null;upCk();upNav()}

function flightPayload(f,date,cabin){
  var full=f.fa[cabin]||0;
  var disc=dFare(f,cabin)||0;
  var aD=f.nd?addD(date,1):date;
  var a=AP[f.from],b=AP[f.to];
  return {
    no:f.no, ac:f.ac, dep:f.dep, arr:f.arr, arrNextDay:f.nd,
    depDate:date, arrDate:aD,
    fromCode:f.from, fromCity:a.city, fromAirport:a.ap, fromUt:a.ut,
    toCode:f.to, toCity:b.city, toAirport:b.ap, toUt:b.ut,
    cabin:cabin, cabinName:cab(cabin).n,
    full:full, dt:f.dt,
    discRate:dRate(f),
    discLabel:f.dt==='express'?'快线 7.3 折':f.dt==='longhaul'?'远程 7.8 折':'短程 6.2 折',
    disc:disc,
    airlineName:alOf(f.no).n, airlineLogo:alOf(f.no).l,
    meals:f.ml, via:f.via
  };
}
function buildSegPayload(key,dir,fc,tc,date,s){
  if(s.type==='d'){
    var f=findF(s.fNo);if(!f)return null;
    var full=f.fa[s.cab]||0,disc=dFare(f,s.cab)||0;
    return {
      key:key, dir:dir, type:'d', date:date,
      fromCode:fc, toCode:tc,
      fromCity:AP[fc].city, toCity:AP[tc].city,
      fromAirport:AP[fc].ap, toAirport:AP[tc].ap,
      flights:[flightPayload(f,date,s.cab)],
      baseFull:full, baseRawDisc:disc, actRate:1,
      activity:null, subTier:'b'
    };
  }
  if(s.type==='t'){
    var a=findF(s.l1No),b=findF(s.l2No);if(!a||!b)return null;
    var full1=a.fa[s.l1Cab]||0,disc1=dFare(a,s.l1Cab)||0;
    var full2=b.fa[s.l2Cab]||0,disc2=dFare(b,s.l2Cab)||0;
    var rawFull=full1+full2,rawDisc=disc1+disc2;
    var act=getAct(a,b),actRate=act?act.rate:1;
    var off=dayOff(a,b),d2=addD(date,off);
    return {
      key:key, dir:dir, type:'t', date:date,
      fromCode:fc, toCode:tc,
      fromCity:AP[fc].city, toCity:AP[tc].city,
      fromAirport:AP[fc].ap, toAirport:AP[tc].ap,
      hubCode:a.to, hubCity:AP[a.to].city, hubAirport:AP[a.to].ap,
      flights:[
        flightPayload(a,date,s.l1Cab),
        flightPayload(b,d2,s.l2Cab)
      ],
      baseFull:rawFull, baseRawDisc:rawDisc, actRate:actRate,
      activity:act?{code:act.code,label:act.label,rate:act.rate}:null,
      subTier:'b'
    };
  }
  return null;
}
function buildPayload(){
  var segs=[];
  if(sel.out){var s1=buildSegPayload('out','去程',state.from,state.to,state.dep,sel.out);if(s1)segs.push(s1)}
  if(state.type==='round'&&sel.in){var s2=buildSegPayload('in','回程',state.to,state.from,state.ret,sel.in);if(s2)segs.push(s2)}
  return {
    state:{type:state.type,from:state.from,to:state.to,dep:state.dep,ret:state.ret},
    segments:segs,
    roundTripRate:state.type==='round'?RND:1
  };
}

$('ckBtn').addEventListener('click',function(){
  try{var payload=buildPayload();sessionStorage.setItem('peace_booking',JSON.stringify(payload))}catch(e){console.error(e)}
  location.href='checkout.html';
});

Array.prototype.forEach.call($('sortBox').querySelectorAll('button'),function(b){b.addEventListener('click',function(){var m=b.getAttribute('data-s');if(m===state.sort)return;state.sort=m;Array.prototype.forEach.call($('sortBox').querySelectorAll('button'),function(x){x.classList.remove('on')});b.classList.add('on');render()})});

function apTT(){var rf=$('retF'),ri=$('ret');if(state.type==='oneway'){rf.style.opacity='.45';ri.disabled=true}else{rf.style.opacity='1';ri.disabled=false}}

function qp(n){return new URLSearchParams(location.search).get(n)}

function init(){
  /* ============ 1) 先读 URL 参数，覆盖默认值 ============ */
  var qf=qp('from'),qt=qp('to'),qd=qp('dep'),qr=qp('ret'),qy=qp('type');
  if(qf)state.from=qf;
  if(qt)state.to=qt;
  if(qy)state.type=qy==='oneway'?'oneway':'round';

  var td=today();
  state.dep=qd||td;
  state.ret=qr||addD(state.dep,7);

  /* ============ 2) 初始化组合框 ============ */
  var comboRoots=document.querySelectorAll('.sf.combo');
  Array.prototype.forEach.call(comboRoots,function(root){initCombo(root)});

  /* 将 state 中的 from/to 回填到输入框 */
  var fromInput=document.getElementById('from');
  var toInput=document.getElementById('to');
  var foundFrom=null,foundTo=null;
  for(var i=0;i<PL.length;i++){
    if(PL[i].code===state.from)foundFrom=PL[i];
    if(PL[i].code===state.to)foundTo=PL[i];
  }
  if(foundFrom){fromInput.value=foundFrom.city+' ('+foundFrom.code+')';window.__s=window.__s||{};window.__s.from=foundFrom;}
  if(foundTo){toInput.value=foundTo.city+' ('+foundTo.code+')';window.__s=window.__s||{};window.__s.to=foundTo;}

  /* ============ 3) 日期与标签 ============ */
  var d=$('dep'),r=$('ret');
  d.value=state.dep;r.value=state.ret;
  d.min=td;r.min=state.dep;
  var tabs=document.querySelectorAll('#tabs button');
  Array.prototype.forEach.call(tabs,function(b){b.classList.remove('on');if(b.getAttribute('data-t')===state.type)b.classList.add('on')});
  apTT();

  /* ============ 4) 事件绑定 ============ */
  Array.prototype.forEach.call(tabs,function(b){b.addEventListener('click',function(){var t=b.getAttribute('data-t');if(!t)return;state.type=t;Array.prototype.forEach.call(tabs,function(x){x.classList.remove('on')});b.classList.add('on');apTT();resetSel();render()})});
  d.addEventListener('change',function(){state.dep=this.value;r.min=this.value||td;if(state.type==='round'&&state.ret&&state.ret<state.dep){state.ret=state.dep;r.value=state.ret}});
  r.addEventListener('change',function(){state.ret=this.value});
  $('searchBtn').addEventListener('click',function(){
    ['from','to'].forEach(function(k){
      var inp=document.getElementById(k),v=inp.value.trim();
      if(!v){state[k]='';return}
      for(var i=0;i<PL.length;i++){var it=PL[i];
        if((it.city+' ('+it.code+')')===v||it.city===v||it.en.toLowerCase()===v.toLowerCase()||it.code.toLowerCase()===v.toLowerCase()||it.note===v){state[k]=it.code;break}
      }
    });
    resetSel();render();
    var b=document.querySelector('.rb');if(b&&b.scrollIntoView)b.scrollIntoView({behavior:'smooth',block:'start'});
  });
  bindNav();
  render();
}
init();
})();
</script>
